[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
publish = false

[workspace.lints.rust]
unsafe_code = "deny"

# Game data is large: unoptimised decompression and parsing make tests that
# read real files take many seconds. Light optimisation keeps debugging usable.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
